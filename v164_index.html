    <!-- v164: Player/Coach/Ref photo manifest (Wikipedia URLs).
         Loaded SYNCHRONOUSLY via XMLHttpRequest so it's available before any
         view renders. If the file is missing, falls back to SVGs gracefully.
         The manifest is cached by the browser (force-cache) so subsequent loads
         are instant. -->
    <script>
        // v164: Synchronous manifest load — blocks page render until the manifest
        // is loaded (or fails). This prevents the race condition where getPlayerPhotoHtml
        // runs before the async fetch completes, causing photos to fall back to SVG
        // and never re-render.
        //
        // A synchronous XHR is normally discouraged, but for a small JSON file
        // (~500KB-1MB) cached by the browser, the blocking time is <100ms on
        // subsequent loads. First load may take 200-500ms depending on disk.
        // This is acceptable for a dashboard that depends on the manifest for
        // every photo render.
        window.PLAYER_PHOTO_MANIFEST = null;
        (function() {
            try {
                var xhr = new XMLHttpRequest();
                xhr.open('GET', 'hist_data/player_photos_manifest.json', false); // false = synchronous
                xhr.setRequestHeader('Cache-Control', 'force-cache');
                xhr.send();
                if (xhr.status === 200) {
                    window.PLAYER_PHOTO_MANIFEST = JSON.parse(xhr.responseText);
                }
            } catch (e) {
                // File missing or invalid JSON — manifest stays null, SVGs used
            }
        })();
    </script>
   
    
    <script src="script/v164_script.js"></script>

    <!-- v162: Embedded photo manifest generator.
         Run window.fetchPhotoManifest() from the console to generate
         player_photos_manifest.json (takes 30-45 min, resume supported). -->
    <script>
    (async function() {
    'use strict';

    // ==================== CONFIG ====================
    const RATE_REST_MS = 200;       // 5 req/s for REST API
    const RATE_COMMONS_MS = 350;    // ~3 req/s for Commons search
    const SAVE_EVERY = 50;          // Save progress every N entities
    const COMMONS_SEARCH_LIMIT = 5; // Top 5 Commons results per query
    const SCORE_THRESHOLD = 6;      // Minimum score to accept a year-specific photo
    const STORAGE_KEY = 'player_photo_manifest_progress';

    // ==================== STATE ====================
    let manifest = {};
    let stats = { total: 0, processed: 0, found: 0, yearSpecific: 0, skipped: 0, errors: 0 };

    // ==================== UTILITIES ====================
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    function log(msg) {
        console.log(`[photo-fetch] ${msg}`);
    }

    function saveProgress() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                manifest,
                stats,
                timestamp: Date.now()
            }));
        } catch (e) {
            console.warn('[photo-fetch] Could not save progress to localStorage:', e.message);
        }
    }

    function loadProgress() {
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) return false;
            const data = JSON.parse(saved);
            manifest = data.manifest || {};
            stats = data.stats || stats;
            log(`Resumed from localStorage: ${stats.processed} entities already processed.`);
            return true;
        } catch (e) {
            return false;
        }
    }

    // ==================== DATA COLLECTION ====================
    /**
     * Collects all player, coach, and ref names from loaded FWCD data,
     * along with the years they appear in.
     * Returns: { players: Map<name, Set<year>>, coaches: Map<name, Set<year>>, refs: Map<name, Set<year>> }
     */
    function collectEntities() {
        const players = new Map();  // name → Set<year>
        const coaches = new Map();  // name → Set<year>
        const refs = new Map();     // name → Set<year>

        // Get list of years from FWCD_Participants
        const years = (typeof uniqueYears !== 'undefined' && Array.isArray(uniqueYears))
            ? uniqueYears.map(y => parseInt(y, 10)).filter(y => !isNaN(y))
            : [2002, 2006, 2010, 2014, 2018, 2022];

        log(`Scanning ${years.length} years: ${years.join(', ')}`);

        for (const year of years) {
            const varName = `FWCD_${year}`;
            const data = window[varName];
            if (!data) {
                log(`  ${varName} not loaded — skipping.`);
                continue;
            }

            // Players: from players_FULL (detailed bios) AND from each team's squad
            if (Array.isArray(data.players_FULL)) {
                data.players_FULL.forEach(p => {
                    if (p && p.name) {
                        if (!players.has(p.name)) players.set(p.name, new Set());
                        players.get(p.name).add(year);
                    }
                });
            }
            // Also scan teams_summary.squad (some players only appear here)
            if (Array.isArray(data.teams_summary)) {
                data.teams_summary.forEach(t => {
                    if (t && Array.isArray(t.squad)) {
                        t.squad.forEach(p => {
                            if (p && (p.name || p.player)) {
                                const name = p.name || p.player;
                                if (!players.has(name)) players.set(name, new Set());
                                players.get(name).add(year);
                            }
                        });
                    }
                    // Coaches
                    if (t && t.coach && t.coach.name) {
                        if (!coaches.has(t.coach.name)) coaches.set(t.coach.name, new Set());
                        coaches.get(t.coach.name).add(year);
                    }
                });
            }

            // Refs: from matches_FULL.referee.name
            if (Array.isArray(data.matches_FULL)) {
                data.matches_FULL.forEach(m => {
                    if (m && m.referee && m.referee.name) {
                        if (!refs.has(m.referee.name)) refs.set(m.referee.name, new Set());
                        refs.get(m.referee.name).add(year);
                    }
                });
            }
        }

        log(`Collected: ${players.size} players, ${coaches.size} coaches, ${refs.size} refs`);
        return { players, coaches, refs };
    }

    // ==================== WIKIPEDIA REST API ====================
    /**
     * Fetch the default thumbnail URL for a name from Wikipedia REST API.
     * Returns: URL string, or null if not found / error.
     */
    async function fetchDefaultPhoto(name) {
        // Wikipedia article titles use underscores, not spaces
        const title = encodeURIComponent(name.replace(/\s+/g, '_'));
        const url = `https://en.wikipedia.org/api/rest_v1/page/summary/${title}`;

        try {
            const resp = await fetch(url, { headers: { 'Accept': 'application/json' } });
            if (!resp.ok) return null;
            const data = await resp.json();
            // Skip disambiguation pages and "no article" responses
            if (data.type === 'disambiguation' || data.type === 'not-found' || data.type === 'Internal error') {
                return null;
            }
            if (data.thumbnail && data.thumbnail.source) {
                return data.thumbnail.source;
            }
            return null;
        } catch (e) {
            return null;
        }
    }

    // ==================== WIKIMEDIA COMMONS SEARCH ====================
    /**
     * Score a Commons search result file based on how likely it is to be a
     * good year-specific headshot of the player.
     *
     * Scoring:
     *   +10  filename contains player's surname (case-insensitive)
     *   +5   filename contains the year
     *   +5   filename contains "world cup", "wc", or "fifa"
     *   +3   filename contains "cropped" (usually headshots)
     *   +3   filename contains team name (argentina, brazil, etc.)
     *   -5   filename contains " vs " or " v " (match photos — usually group shots)
     *   -3   filename contains "team" (squad photos)
     */
    function scoreCommonsResult(filename, playerName, year) {
        const lower = filename.toLowerCase();
        let score = 0;

        // Surname check — use the last word of the player name
        const parts = playerName.trim().toLowerCase().split(/\s+/);
        const surname = parts[parts.length - 1];
        if (surname.length >= 3 && lower.includes(surname)) score += 10;

        // Year check
        if (lower.includes(String(year))) score += 5;

        // World Cup context
        if (lower.includes('world cup') || lower.includes('wc') || lower.includes('fifa')) score += 5;

        // Cropped (headshot indicator)
        if (lower.includes('cropped')) score += 3;

        // Team name (basic check — could be enhanced with alias list)
        // We'll just check for common WC team name fragments
        const teamWords = ['argentina', 'brazil', 'germany', 'france', 'spain', 'england', 'italy',
                          'portugal', 'netherlands', 'belgium', 'croatia', 'uruguay', 'mexico',
                          'japan', 'korea', 'usa', 'switzerland', 'denmark', 'sweden', 'poland',
                          'serbia', 'morocco', 'senegal', 'ghana', 'nigeria', 'cameroon',
                          'ecuador', 'chile', 'colombia', 'peru', 'australia', 'iran', 'saudi',
                          'qatar', 'tunisia', 'wales', 'scotland', 'ireland', 'russia', 'ukraine',
                          'austria', 'hungary', 'czech', 'romania', 'greece', 'turkey', 'algeria',
                          'ivory', 'costa', 'honduras', 'south', 'north', 'egypt', 'iraq', 'kuwait'];
        for (const w of teamWords) {
            if (lower.includes(w)) { score += 3; break; }
        }

        // Penalties
        if (lower.includes(' vs ') || lower.includes(' v ')) score -= 5;
        if (lower.includes('team') && !lower.includes('cropped')) score -= 3;

        return score;
    }

    /**
     * Search Wikimedia Commons for a year-specific photo of the player.
     * Returns: { url, filename, score } or null if no good result.
     */
    async function fetchYearSpecificPhoto(playerName, year) {
        // Build search query — try multiple formats
        // Format 1: "PlayerName Year World Cup"
        // Format 2: "PlayerName Year" (broader)
        const queries = [
            `${playerName} ${year} World Cup`,
            `${playerName} ${year}`,
        ];

        for (const query of queries) {
            const params = new URLSearchParams({
                action: 'query',
                generator: 'search',
                gsrsearch: query,
                gsrnamespace: '6',  // File namespace
                gsrlimit: String(COMMONS_SEARCH_LIMIT),
                prop: 'imageinfo',
                iiprop: 'url|mimetype',
                iiurlwidth: '320',
                format: 'json',
                origin: '*'
            });
            const url = `https://commons.wikimedia.org/w/api.php?${params}`;

            try {
                const resp = await fetch(url);
                if (!resp.ok) continue;
                const data = await resp.json();
                const pages = data?.query?.pages;
                if (!pages) continue;

                // Score each result, pick the best
                const results = [];
                for (const pid in pages) {
                    const page = pages[pid];
                    const filename = page.title || '';
                    // Skip non-image files (PDFs, OGgs, etc.)
                    const ii = page.imageinfo && page.imageinfo[0];
                    if (!ii) continue;
                    if (ii.mimetype && !ii.mimetype.startsWith('image/')) continue;
                    if (!ii.thumburl) continue;

                    const score = scoreCommonsResult(filename, playerName, year);
                    results.push({ url: ii.thumburl, filename, score });
                }

                if (results.length === 0) continue;

                // Sort by score descending
                results.sort((a, b) => b.score - a.score);
                const best = results[0];

                // Only accept if score meets threshold
                if (best.score >= SCORE_THRESHOLD) {
                    return best;
                }
                // If first query didn't find a good match, try the next query format
            } catch (e) {
                // Network error — try next query
                continue;
            }
        }

        return null;
    }

    // ==================== MAIN PROCESSING ====================
    async function processEntity(name, years, type) {
        // Already processed? (from resume)
        const key = name;
        if (manifest[key] !== undefined) {
            stats.skipped++;
            return;
        }

        stats.processed++;

        // Fetch default photo from Wikipedia REST API
        await sleep(RATE_REST_MS);
        const defaultUrl = await fetchDefaultPhoto(name);

        if (!defaultUrl) {
            // Not on Wikipedia — mark as null so we don't retry
            manifest[key] = null;
            stats.errors++;
            return;
        }

        stats.found++;
        const entry = { default: defaultUrl, byYear: {} };

        // For players, fetch year-specific photos (only for years they actually played)
        if (type === 'player' && years.size > 0) {
            const sortedYears = Array.from(years).sort();
            for (const year of sortedYears) {
                await sleep(RATE_COMMONS_MS);
                const result = await fetchYearSpecificPhoto(name, year);
                if (result) {
                    entry.byYear[String(year)] = result.url;
                    stats.yearSpecific++;
                }
            }
        }

        manifest[key] = entry;
    }

    async function run() {
        log('Starting photo manifest generation...');

        // Try to resume from localStorage
        loadProgress();

        // Make sure all FWCD data is loaded
        log('Ensuring all FWCD data files are loaded...');
        if (typeof ensureCrossYearIndex === 'function') {
            await ensureCrossYearIndex();
        }
        // Force-load each year's data
        const years = (typeof uniqueYears !== 'undefined' && Array.isArray(uniqueYears))
            ? uniqueYears.map(y => parseInt(y, 10)).filter(y => !isNaN(y))
            : [2002, 2006, 2010, 2014, 2018, 2022];
        for (const year of years) {
            const varName = `FWCD_${year}`;
            if (!window[varName]) {
                log(`  Loading FWCD_${year}...`);
                try {
                    if (typeof loadHistoricalData === 'function') {
                        await loadHistoricalData(year);
                    }
                } catch (e) {
                    log(`  Could not load FWCD_${year}: ${e.message}`);
                }
            }
        }

        // Collect all entities
        const { players, coaches, refs } = collectEntities();
        stats.total = players.size + coaches.size + refs.size;
        log(`Total entities to process: ${stats.total} (${players.size} players, ${coaches.size} coaches, ${refs.size} refs)`);

        // Process players (with year-specific photos)
        log('--- Processing PLAYERS (with year-specific photos) ---');
        let playerCount = 0;
        for (const [name, years] of players) {
            playerCount++;
            if (playerCount % 25 === 0) {
                log(`  Player ${playerCount}/${players.size}: ${name} (years: ${Array.from(years).join(',')})`);
            }
            await processEntity(name, years, 'player');
            if (stats.processed % SAVE_EVERY === 0) {
                saveProgress();
                log(`  [progress] processed=${stats.processed}/${stats.total} found=${stats.found} yearSpecific=${stats.yearSpecific} errors=${stats.errors}`);
            }
        }

        // Process coaches (default only — no year-specific)
        log('--- Processing COACHES (default photo only) ---');
        for (const [name, years] of coaches) {
            await processEntity(name, years, 'coach');
            if (stats.processed % SAVE_EVERY === 0) {
                saveProgress();
                log(`  [progress] processed=${stats.processed}/${stats.total} found=${stats.found} errors=${stats.errors}`);
            }
        }

        // Process refs (default only)
        log('--- Processing REFEREES (default photo only) ---');
        for (const [name, years] of refs) {
            await processEntity(name, years, 'ref');
            if (stats.processed % SAVE_EVERY === 0) {
                saveProgress();
                log(`  [progress] processed=${stats.processed}/${stats.total} found=${stats.found} errors=${stats.errors}`);
            }
        }

        // Final save
        saveProgress();

        // Summary
        log('========================================');
        log('PHOTO MANIFEST GENERATION COMPLETE');
        log('========================================');
        log(`Total entities:    ${stats.total}`);
        log(`Processed:         ${stats.processed}`);
        log(`Skipped (resumed): ${stats.skipped}`);
        log(`Found on Wikipedia: ${stats.found}`);
        log(`  Year-specific:   ${stats.yearSpecific}`);
        log(`Not found:         ${stats.errors}`);
        log(`Manifest size:     ${Object.keys(manifest).length} entries`);

        // Store globally for inspection
        window.PLAYER_PHOTO_MANIFEST = manifest;

        // Trigger download
        const json = JSON.stringify(manifest, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'player_photos_manifest.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        log('Manifest downloaded as player_photos_manifest.json');
        log('Place this file in hist_data/ and the dashboard will use it automatically.');

        return manifest;
    }

    // Expose for manual control — SILENT on page load (v163).
    // Only log when the user actually invokes fetchPhotoManifest() from the console.
    // Previously the IIFE logged "Run window.fetchPhotoManifest() to start." on every
    // page load, which was unnecessary console noise.
    window.fetchPhotoManifest = run;
    window.photoManifestStats = stats;
    window.clearPhotoManifestProgress = function() {
        localStorage.removeItem(STORAGE_KEY);
        log('Progress cleared. Re-run fetchPhotoManifest() to start fresh.');
    };
    // No auto-run logging — the functions are available silently.
})();

    </script>
